<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- BellaCoins · Preço do dia · feed 4:5 (modo vitrine). Gerado por gerar.py: os campos entre chaves duplas são preenchidos por ele. -->
  <defs>
    <radialGradient id="luzMagenta" cx="1080" cy="0" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2E88" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luzOuro" cx="0" cy="1350" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC23D" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#FFC23D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brilhoBella" x1="72" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset=".5" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#FFC23D"/>
    </linearGradient>
    <linearGradient id="gOuro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE59A"/>
      <stop offset=".45" stop-color="#FFC23D"/>
      <stop offset="1" stop-color="#E8890C"/>
    </linearGradient>
    <!-- símbolo oficial (marca/logo/simbolo.svg) -->
    <symbol id="moeda" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#gOuro)"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#B45309" stroke-width="2"/>
      <circle cx="50" cy="50" r="38.5" fill="none" stroke="#B45309" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 3"/>
      <text x="48" y="69" text-anchor="middle" font-family="Fraunces" font-style="italic" font-weight="900" font-size="58" fill="#160A24">B</text>
      <path d="M78 6 L81.5 17.5 L93 21 L81.5 24.5 L78 36 L74.5 24.5 L63 21 L74.5 17.5 Z" fill="#FFF4F8" stroke="#FF2E88" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <path id="brilho4" d="M0 -1 L.16 -.16 L1 0 L.16 .16 L0 1 L-.16 .16 L-1 0 L-.16 -.16 Z"/>
  </defs>

  <!-- fundo Noite Ameixa com as duas luzes -->
  <rect width="1080" height="1350" fill="#160A24"/>
  <rect width="1080" height="1350" fill="url(#luzMagenta)"/>
  <rect width="1080" height="1350" fill="url(#luzOuro)"/>

  <!-- moeda grande, inclinada, saindo pela direita -->
  <g transform="rotate(-14 900 560)" opacity=".95">
    <use xlink:href="#moeda" href="#moeda" x="600" y="260" width="600" height="600"/>
  </g>

  <!-- topo: logo + data -->
  <text x="72" y="160"><tspan font-family="Fraunces" font-style="italic" font-weight="900" font-size="112" letter-spacing="-2" fill="url(#brilhoBella)">Bella</tspan><tspan dx="14" font-family="Unbounded" font-weight="800" font-size="47" letter-spacing="6.5" fill="#FFC23D">COINS</tspan></text>
  <text x="1008" y="146" text-anchor="end" font-family="DM Mono" font-size="34" fill="#B9A8CC">{{DATA}}</text>

  <!-- meio: preço -->
  <text x="72" y="{{Y_ROTULO}}" font-family="Unbounded" font-weight="700" font-size="34" letter-spacing="4" fill="#FFC23D">PREÇO DO DIA · {{TC}} TC</text>
  <text x="72" y="1170" font-family="Unbounded" font-weight="800" font-size="{{TAM_PRECO}}" letter-spacing="-3" fill="#FFF4F8">R$ {{REAIS}}<tspan font-size="{{TAM_CENT}}" letter-spacing="0">,{{CENTAVOS}}</tspan></text>
  <use href="#brilho4" xlink:href="#brilho4" transform="translate(1000 {{Y_BRILHO}}) scale(34)" fill="#FFC23D"/>

  <!-- rodapé: selos + @ -->
{{SELOS}}
  <text x="1008" y="1282" text-anchor="end" font-family="Plus Jakarta Sans" font-weight="600" font-size="34" fill="#B9A8CC">{{INSTA}}</text>
</svg>
